
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: status-api-helm
  namespace: argocd

spec:
  project: default

  info:
    - name: Description
      value: "GitOps-managed Node.js Status API deployed on Amazon EKS using Helm and Amazon ECR."

  source:
    repoURL: https://github.com/aneesahmad081/devsecops-gitops-eks-starter.git
    targetRevision: gitops
    path: charts/status-api

    helm:
      releaseName: status-api-helm
      valueFiles:
        - values-eks.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-demo

 
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true

