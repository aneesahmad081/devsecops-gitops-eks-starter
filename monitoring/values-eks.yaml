
# Phase 9C: Lightweight Kubernetes monitoring
# Environment: AWS EKS, one m7i-flex.large node
# Helm chart: kube-prometheus-stack 93.9.0

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# Save resources in the initial lab.
alertmanager:
  enabled: false

# EKS manages these control-plane components.
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Asia/Karachi

  service:
    type: ClusterIP

  persistence:
    enabled: false

  sidecar:
    datasources:
      alertmanager:
        enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 150Mi
    limits:
      cpu: 250m
      memory: 450Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 300Mi

prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    replicas: 1
    retention: 6h
    retentionSize: "1GB"
    scrapeInterval: 30s
    evaluationInterval: 30s

    resources:
      requests:
        cpu: 150m
        memory: 350Mi
      limits:
        cpu: 600m
        memory: 1200Mi

    # No EBS persistent volume for this temporary lab.
    storageSpec: {}

    # Allow future application ServiceMonitors.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 30m
      memory: 80Mi
    limits:
      cpu: 150m
      memory: 200Mi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 40Mi
    limits:
      cpu: 100m
      memory: 120Mi
