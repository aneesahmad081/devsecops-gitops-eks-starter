name: Starter CI - Test and Build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax
        run: npm run check
        working-directory: app
      - name: Run tests
        run: npm test
        working-directory: app
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build local CI image (no publishing)
        run: docker build -t devsecops-status-api:${{ github.sha }} ./app
